; Shared PlatformIO settings for the Guition ESP32-4848S040C_I.
; Projects pull this in with:
;   [platformio]
;   extra_configs = ../../common/platformio-base.ini
;   [env:esp32-4848s040]
;   extends = base_4848s040
; Paths here are relative to the project directory (projects/NN-name).

[base_4848s040]
; pioarduino 54.03.21-2 = Arduino core 3.2.1 / ESP-IDF 5.4. Newer releases need PlatformIO Core >= 6.2
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; ESP32-S3-WROOM-1U-N16R8: 16 MB QIO flash + 8 MB octal PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; -O2 instead of the core's default -Os: measured ~10% faster LVGL rendering on this board.
; -Os must be removed (not just overridden): the core adds it after build_flags, and the last -O wins.
build_unflags = -Os
build_flags =
    -O2
    -DBOARD_HAS_PSRAM
    ; Serial goes to UART0 -> CH340C -> USB-C. Native USB pins (19/20) are used by touch/LCD.
    -DARDUINO_USB_CDC_ON_BOOT=0

lib_deps =
    symlink://../../common/lib/Board4848S040

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
