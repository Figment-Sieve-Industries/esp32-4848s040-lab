; 04-lvgl-fb2-bench - Guition ESP32-4848S040C_I
; LVGL Benchmark on the opt-in double-framebuffer path (board4848::lvglBeginDoubleBuffered):
; 2 PSRAM framebuffers owned by the ESP-IDF RGB driver, LVGL DIRECT mode, vsync-synchronised swap.
; Compare with 03-lvgl-demos [env:bench] (single framebuffer + 20 ms flush copy).
; Build/flash/monitor from PowerShell: .\tools\pio.ps1 -Project 04-lvgl-fb2-bench -Action all
; Shared settings: ../../common/platformio-base.ini

[platformio]
extra_configs = ../../common/platformio-base.ini
default_envs = esp32-4848s040

[env:esp32-4848s040]
extends = base_4848s040
build_flags =
    ${base_4848s040.build_flags}
    ; lv_conf.h lives in include/
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
lib_deps =
    ${base_4848s040.lib_deps}
    lvgl/lvgl @ 9.5.0
; PlatformIO only compiles lvgl/src, so pull the demo sources into this project's build.
build_src_filter =
    +<*>
    +<../.pio/libdeps/${PIOENV}/lvgl/demos/>

; Same, but LVGL redraws the whole screen every frame (LV_DISPLAY_RENDER_MODE_FULL).
[env:full]
extends = env:esp32-4848s040
build_flags =
    ${env:esp32-4848s040.build_flags}
    -DFB2_FULL_REFRESH=1
