; 03-lvgl-demos - Guition ESP32-4848S040C_I
; LVGL's official demos behind a touch launcher.
; Build/flash/monitor from PowerShell: .\tools\pio.ps1 -Project 03-lvgl-demos -Action all
; Shared settings: ../../common/platformio-base.ini

[platformio]
extra_configs = ../../common/platformio-base.ini
default_envs = esp32-4848s040

[env:esp32-4848s040]
extends = base_4848s040
build_flags =
    ${base_4848s040.build_flags}
    ; lv_conf.h lives in include/
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
lib_deps =
    ${base_4848s040.lib_deps}
    lvgl/lvgl @ 9.5.0
; PlatformIO only compiles lvgl/src, so pull the demo sources into this project's build.
build_src_filter =
    +<*>
    +<../.pio/libdeps/${PIOENV}/lvgl/demos/>

; Boots straight into the Benchmark (no touch needed) for automated measurements.
; Extra experiment flags can be appended via the PLATFORMIO_BUILD_FLAGS environment variable.
[env:bench]
extends = env:esp32-4848s040
build_flags =
    ${env:esp32-4848s040.build_flags}
    -DDEMO_AUTORUN=2

; Rotation 3 (USB-C at the bottom, as project 05) with lvglBegin's own rotation-3 flush path.
[env:bench-rot3]
extends = env:bench
build_flags =
    ${env:bench.build_flags}
    -DSCREEN_ROTATION=3

; Same, but forced through Arduino_GFX's rotated draw16bitRGBBitmap (the old path) for an A/B comparison.
[env:bench-rot3-gfx]
extends = env:bench
build_flags =
    ${env:bench.build_flags}
    -DSCREEN_ROTATION=3
    -DB4848_ROT3_FAST_FLUSH=0
