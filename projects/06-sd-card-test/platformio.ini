; 06-sd-card-test - Guition ESP32-4848S040C_I
; microSD bring-up: mount, card info, functional tests, speed sweep, soak, hot-swap.
; Build/flash/monitor from PowerShell: .\tools\pio.ps1 -Project 06-sd-card-test -Action all
; Shared settings: ../../common/platformio-base.ini

[platformio]
extra_configs = ../../common/platformio-base.ini

[env:esp32-4848s040]
extends = base_4848s040
build_flags =
    ${base_4848s040.build_flags}
    ; Core warnings/errors on serial: shows the SD driver's "Wait Failed" / "Select Failed" etc.
    -DCORE_DEBUG_LEVEL=2
lib_deps =
    ${base_4848s040.lib_deps}
    ; Patched SD (replaces the core's built-in one) + the SD helper module, both shared with 05
    symlink://../../common/lib/SD
    symlink://../../common/lib/SdStore
