; 02-lvgl-hello - Guition ESP32-4848S040C_I
; Build/flash/monitor from PowerShell: .\tools\pio.ps1 -Project 02-lvgl-hello -Action all
; Shared settings: ../../common/platformio-base.ini

[platformio]
extra_configs = ../../common/platformio-base.ini

[env:esp32-4848s040]
extends = base_4848s040
build_flags =
    ${base_4848s040.build_flags}
    ; lv_conf.h lives in include/
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
lib_deps =
    ${base_4848s040.lib_deps}
    lvgl/lvgl @ 9.5.0
