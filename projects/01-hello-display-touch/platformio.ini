; 01-hello-display-touch - Guition ESP32-4848S040C_I
; Build:   pio run
; Flash:   pio run -t upload        (USB-C, CH340C; auto-reset, no buttons needed)
; Monitor: pio device monitor

[platformio]
; Shared board library lives in ../../common/lib
lib_dir = ../../common/lib

[env:esp32-4848s040]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip  ; Arduino core 3.2.1. Newer releases need PlatformIO Core >= 6.2
board = esp32-s3-devkitc-1
framework = arduino

; N16R8 module: 16 MB QIO flash + 8 MB octal PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    ; Serial goes to UART0 -> CH340C -> USB-C. Native USB pins (19/20) are used by touch/LCD.
    -DARDUINO_USB_CDC_ON_BOOT=0

lib_deps =
    Board4848S040
    moononournation/GFX Library for Arduino @ ^1.6.4

monitor_speed = 115200
upload_speed = 921600
