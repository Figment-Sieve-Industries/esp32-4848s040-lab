; 05-powerwall-display - Guition ESP32-4848S040C_I
; Live Tesla Powerwall 3 power flow over the local LAN API.
; Build/flash/monitor from PowerShell: .\tools\pio.ps1 -Project 05-powerwall-display -Action all
; Needs src/secrets.h (copy src/secrets.example.h).

[platformio]
extra_configs = ../../common/platformio-base.ini
default_envs = esp32-4848s040

[env:esp32-4848s040]
extends = base_4848s040
build_flags =
    ${base_4848s040.build_flags}
    ; lv_conf.h lives in include/
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
    ; Wi-Fi + TLS need internal RAM: smaller LVGL draw buffer than the 120-line default
    -DB4848_LVGL_BUF_LINES=48
lib_deps =
    ${base_4848s040.lib_deps}
    lvgl/lvgl @ 9.5.0
    bblanchon/ArduinoJson @ 7.4.3
